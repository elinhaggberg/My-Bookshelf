<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>
    // Applied before the stylesheet paints, since the module script that
    // normally owns theming (js/theme.js) runs after HTML parsing and would
    // otherwise flash the default theme first on every load.
    try {
      var themeMode = (JSON.parse(localStorage.getItem("mb_theme_v1") || "{}") || {}).mode;
      document.documentElement.dataset.theme = themeMode || "playful";
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>My Bookshelf</title>
  <meta name="description" content="Track what you're reading, finished and want to read next — all stored on your device, no account, no ads." />
  <meta name="theme-color" content="#f6f1e4" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- ===== Shared shelf view (Home / To Read / Reading) ===== -->
  <template id="tpl-shelf">
    <header class="topbar">
      <h1 id="shelf-title"></h1>
      <button class="icon-btn" id="search-btn" aria-label="Search"><svg class="icon icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg></button>
      <button class="icon-btn" id="filter-btn" aria-label="Filter and sort"><svg class="icon icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M7 12h10"/><path d="M10.5 19h3"/></svg></button>
      <button class="icon-btn settings-btn" id="settings-btn" aria-label="Menu"><svg class="icon icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2.2" stroke-linecap="round"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17"/></svg></button>
    </header>
    <div id="storage-warning-banner" class="banner hidden">
      <p>Local storage is almost full — consider removing older books or covers to free up space.</p>
      <div class="banner-actions">
        <button type="button" class="text-btn" id="storage-warning-dismiss-btn">Got it</button>
      </div>
    </div>
    <div id="backup-banner" class="banner hidden">
      <p>You haven't backed up in a while — export takes a second.</p>
      <div class="banner-actions">
        <button type="button" class="text-btn primary" id="backup-now-btn">Back up now</button>
        <button type="button" class="text-btn" id="backup-dismiss-btn">Later</button>
      </div>
    </div>
    <div class="page-body">
      <div class="card-grid" id="shelf-grid"></div>
    </div>
    <button class="fab" id="add-btn" aria-label="Add a book"><svg class="icon" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path d="M256 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 160-160 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l160 0 0 160c0 17.7 14.3 32 32 32s32-14.3 32-32l0-160 160 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-160 0 0-160z"/></svg></button>
  </template>

  <template id="tpl-pin-card">
    <article class="pin">
      <img class="pin-media hidden" loading="lazy" />
      <div class="pin-media-placeholder hidden"></div>
      <div class="pin-body">
        <h3 class="pin-title"></h3>
        <div class="pin-meta">
          <span class="pin-source hidden"></span>
        </div>
        <span class="pin-badge hidden"></span>
      </div>
    </article>
  </template>

  <!-- ===== Add / edit book ===== -->
  <template id="tpl-book-editor">
    <div class="sheet">
      <header class="sheet-header">
        <h2 id="editor-heading">Add a book</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>

      <div id="editor-url-block">
        <div class="field-row">
          <label class="field" style="flex:1">
            <span>Link (optional)</span>
            <input type="url" id="editor-url-input" placeholder="Paste a Goodreads / Amazon link…" autocomplete="off" />
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="text-btn secondary" id="editor-fetch-btn">Fetch details</button>
        </div>
        <p class="import-message hidden" id="editor-fetch-message"></p>
      </div>

      <div class="photo-drop" id="photo-drop">
        <svg class="icon icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M4 17l5-6 4 4 3-3 5 6"/></svg>
        <span>Add a cover photo</span>
        <div class="photo-source-row">
          <button type="button" class="text-btn secondary" id="photo-camera-btn">Camera</button>
          <button type="button" class="text-btn secondary" id="photo-library-btn">Library</button>
        </div>
      </div>
      <div class="photo-preview-wrap hidden" id="photo-preview-wrap">
        <img class="photo-preview" id="photo-preview-img" alt="" />
        <button type="button" class="photo-preview-clear" id="photo-clear-btn" aria-label="Remove photo"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </div>
      <input type="file" accept="image/*" capture="environment" id="camera-input" hidden />
      <input type="file" accept="image/*" id="library-input" hidden />

      <label class="field">
        <span>Title</span>
        <input type="text" id="editor-title" maxlength="200" placeholder="Untitled" />
      </label>
      <label class="field">
        <span>Author</span>
        <input type="text" id="editor-author" maxlength="120" placeholder="Author name" />
      </label>
      <div class="field">
        <span>Genres</span>
        <div id="editor-genre" class="tag-input-container"></div>
        <datalist id="genre-suggestions"></datalist>
      </div>

      <p class="card-detail-section-label">Format</p>
      <div class="segmented" id="editor-format-segmented" style="margin-bottom:16px;">
        <button type="button" class="segmented-option" data-format="physical">Physical</button>
        <button type="button" class="segmented-option" data-format="audiobook">Audiobook</button>
      </div>

      <p class="card-detail-section-label">Your rating</p>
      <div class="star-picker" id="editor-star-picker" style="margin-bottom:16px;"></div>

      <div class="field-row">
        <label class="field">
          <span>Started</span>
          <input type="date" id="editor-started-input" />
        </label>
        <button type="button" class="text-btn secondary today-btn" id="editor-started-today-btn">Today</button>
      </div>
      <div class="field-row">
        <label class="field">
          <span>Finished</span>
          <input type="date" id="editor-finished-input" />
        </label>
        <button type="button" class="text-btn secondary today-btn" id="editor-finished-today-btn">Today</button>
      </div>

      <label class="field">
        <span>Notes</span>
        <textarea id="editor-note" maxlength="1000" placeholder="Anything you want to remember…"></textarea>
      </label>

      <p class="import-message error hidden" id="editor-save-error"></p>
      <div class="form-actions">
        <button type="button" class="text-btn primary" id="editor-save-btn">Save</button>
      </div>
    </div>
  </template>

  <!-- ===== Book detail (view) ===== -->
  <template id="tpl-book-detail">
    <div class="sheet">
      <header class="sheet-header">
        <span style="flex:1"></span>
        <button class="icon-btn" id="detail-edit-btn" aria-label="Edit" title="Edit"><svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M352.9 21.2L308 66.1 445.9 204 490.8 159.1C504.4 145.6 512 127.2 512 108s-7.6-37.6-21.2-51.1L455.1 21.2C441.6 7.6 423.2 0 404 0s-37.6 7.6-51.1 21.2zM274.1 100L58.9 315.1c-10.7 10.7-18.5 24.1-22.6 38.7L.9 481.6c-2.3 8.3 0 17.3 6.2 23.4s15.1 8.5 23.4 6.2l127.8-35.5c14.6-4.1 27.9-11.8 38.7-22.6L412 237.9 274.1 100z"/></svg></button>
        <button class="icon-btn" id="detail-share-btn" aria-label="Export / share" title="Export"><svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M384 192c53 0 96-43 96-96s-43-96-96-96-96 43-96 96c0 5.4 .5 10.8 1.3 16L159.6 184.1c-16.9-15-39.2-24.1-63.6-24.1-53 0-96 43-96 96s43 96 96 96c24.4 0 46.6-9.1 63.6-24.1L289.3 400c-.9 5.2-1.3 10.5-1.3 16 0 53 43 96 96 96s96-43 96-96-43-96-96-96c-24.4 0-46.6 9.1-63.6 24.1L190.7 272c.9-5.2 1.3-10.5 1.3-16s-.5-10.8-1.3-16l129.7-72.1c16.9 15 39.2 24.1 63.6 24.1z"/></svg></button>
        <button class="icon-btn" id="detail-delete-btn" aria-label="Delete" title="Delete"><svg class="icon" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path d="M136.7 5.9C141.1-7.2 153.3-16 167.1-16l113.9 0c13.8 0 26 8.8 30.4 21.9L320 32 416 32c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 96C14.3 96 0 81.7 0 64S14.3 32 32 32l96 0 8.7-26.1zM32 144l384 0 0 304c0 35.3-28.7 64-64 64L96 512c-35.3 0-64-28.7-64-64l0-304zm88 64c-13.3 0-24 10.7-24 24l0 192c0 13.3 10.7 24 24 24s24-10.7 24-24l0-192c0-13.3-10.7-24-24-24zm104 0c-13.3 0-24 10.7-24 24l0 192c0 13.3 10.7 24 24 24s24-10.7 24-24l0-192c0-13.3-10.7-24-24-24zm104 0c-13.3 0-24 10.7-24 24l0 192c0 13.3 10.7 24 24 24s24-10.7 24-24l0-192c0-13.3-10.7-24-24-24z"/></svg></button>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>
      <img class="card-detail-media hidden" id="detail-image" alt="" />
      <h2 class="card-detail-title" id="detail-title"></h2>
      <p class="card-detail-author hidden" id="detail-author"></p>
      <div class="detail-tags" id="detail-tags"></div>
      <div class="star-picker" id="detail-star-picker" style="margin-bottom:16px;"></div>
      <a class="card-detail-link hidden" id="detail-link" target="_blank" rel="noopener noreferrer">
        <svg class="icon icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2.2" stroke-linecap="round"><rect x="1.8" y="9" width="10" height="6" rx="3" transform="rotate(-45 6.8 12)"/><rect x="12.2" y="9" width="10" height="6" rx="3" transform="rotate(-45 17.2 12)"/></svg>
        <span id="detail-link-text"></span>
        <svg class="icon icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"><path d="M9 3h12v12"/><path d="M21 3L10 14"/><path d="M17 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h6"/></svg>
      </a>
      <p class="card-detail-note hidden" id="detail-note"></p>
      <p class="card-detail-section-label">Reading log</p>
      <div id="detail-log" class="detail-log"></div>
      <div class="form-actions">
        <button type="button" class="text-btn secondary" id="detail-start-btn">Start reading today</button>
        <button type="button" class="text-btn secondary" id="detail-finish-btn">Finish reading today</button>
      </div>
    </div>
  </template>

  <!-- ===== Filter & sort ===== -->
  <template id="tpl-filter-sort">
    <div class="sheet">
      <header class="sheet-header">
        <h2>Filter &amp; sort</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>
      <label class="field">
        <span>Search</span>
        <input type="text" id="filter-query-input" placeholder="Title, author, genre, notes…" autocomplete="off" />
      </label>
      <p class="card-detail-section-label" style="margin-top:16px;">Sort by</p>
      <div class="sort-option-list" id="filter-sort-list"></div>
      <p class="card-detail-section-label" style="margin-top:8px;">Star rating</p>
      <div class="filter-chip-row" id="filter-rating-row"></div>
      <div id="filter-genre-section">
        <p class="card-detail-section-label" style="margin-top:16px;">Genre</p>
        <div class="filter-chip-row" id="filter-genre-row"></div>
      </div>
      <p class="card-detail-section-label" style="margin-top:16px;">Format</p>
      <div class="filter-chip-row" id="filter-format-row"></div>
      <div class="form-actions" style="margin-top:16px;">
        <button type="button" class="text-btn secondary" id="filter-reset-btn">Reset</button>
      </div>
    </div>
  </template>

  <!-- ===== Search ===== -->
  <template id="tpl-search">
    <div class="sheet search-sheet">
      <header class="sheet-header">
        <h2>Search</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>
      <label class="field">
        <span>Search all books</span>
        <input type="text" id="search-input" placeholder="Title, author, genre, notes…" autocomplete="off" />
      </label>
      <p class="empty-state" id="search-empty"></p>
      <div class="card-grid" id="search-results"></div>
    </div>
  </template>

  <!-- ===== Settings ===== -->
  <template id="tpl-settings-menu">
    <div class="sheet">
      <header class="sheet-header">
        <h2>Settings</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>
      <button type="button" class="menu-item" id="instructions-btn">
        <svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><circle cx="256" cy="256" r="216" fill="none" stroke="currentColor" stroke-width="40" /><circle cx="256" cy="176" r="28" /><rect x="228" y="232" width="56" height="180" rx="12" /></svg>
        <span>Instructions</span>
      </button>
      <button type="button" class="menu-item" id="customize-btn">
        <svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><rect x="32" y="86" width="448" height="32" rx="16" /><circle cx="176" cy="102" r="40" /><rect x="32" y="240" width="448" height="32" rx="16" /><circle cx="336" cy="256" r="40" /><rect x="32" y="394" width="448" height="32" rx="16" /><circle cx="256" cy="410" r="40" /></svg>
        <span>Customize</span>
      </button>
      <button type="button" class="menu-item" id="export-all-btn">
        <svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M384 192c53 0 96-43 96-96s-43-96-96-96-96 43-96 96c0 5.4 .5 10.8 1.3 16L159.6 184.1c-16.9-15-39.2-24.1-63.6-24.1-53 0-96 43-96 96s43 96 96 96c24.4 0 46.6-9.1 63.6-24.1L289.3 400c-.9 5.2-1.3 10.5-1.3 16 0 53 43 96 96 96s96-43 96-96-43-96-96-96c-24.4 0-46.6 9.1-63.6 24.1L190.7 272c.9-5.2 1.3-10.5 1.3-16s-.5-10.8-1.3-16l129.7-72.1c16.9 15 39.2 24.1 63.6 24.1z"/></svg>
        <span>Export all data</span>
      </button>
      <button type="button" class="menu-item" id="import-btn">
        <svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M64 0C28.7 0 0 28.7 0 64l0 240 182.1 0-31-31c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l72 72c9.4 9.4 9.4 24.6 0 33.9l-72 72c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l31-31-182.1 0 0 96c0 35.3 28.7 64 64 64l256 0c35.3 0 64-28.7 64-64l0-277.5c0-17-6.7-33.3-18.7-45.3L258.7 18.7C246.7 6.7 230.5 0 213.5 0L64 0zM325.5 176L232 176c-13.3 0-24-10.7-24-24L208 58.5 325.5 176z"/></svg>
        <span>Import</span>
      </button>
      <button type="button" class="menu-item" id="cloud-sync-btn">
        <svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M144 224c-53 0-96 43-96 96s43 96 96 96l288 0c44.2 0 80-35.8 80-80c0-38.8-27.6-71.1-64.3-78.4c.2-2.5 .3-5 .3-7.6c0-53-43-96-96-96c-19.6 0-37.9 5.9-53.1 16.1C185.5 130.6 145.5 96 96 96C43 96 0 139 0 192c0 20.3 6.3 39.1 17 54.6C7.4 261.3 0 279.5 0 300z"/></svg>
        <span>Cloud sync</span>
      </button>
      <button type="button" class="menu-item" id="app-library-link-btn">
        <svg class="icon" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path d="M64 32C28.7 32 0 60.7 0 96l0 64c0 35.3 28.7 64 64 64l64 0c35.3 0 64-28.7 64-64l0-64c0-35.3-28.7-64-64-64L64 32zM64 224c-35.3 0-64 28.7-64 64l0 64c0 35.3 28.7 64 64 64l64 0c35.3 0 64-28.7 64-64l0-64c0-35.3-28.7-64-64-64l-64 0zM256 96l0 64c0 35.3 28.7 64 64 64l64 0c35.3 0 64-28.7 64-64l0-64c0-35.3-28.7-64-64-64l-64 0c-35.3 0-64 28.7-64 64zM320 224c-35.3 0-64 28.7-64 64l0 64c0 35.3 28.7 64 64 64l64 0c35.3 0 64-28.7 64-64l0-64c0-35.3-28.7-64-64-64l-64 0z"/></svg>
        <span>App Library</span>
      </button>
    </div>
  </template>

  <!-- ===== Photo storage migration notice ===== -->
  <template id="tpl-migration-notice">
    <div class="sheet">
      <header class="sheet-header">
        <h2>Cover photo storage upgrade</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>
      <div class="instructions-body">
        <section>
          <p>This update changes how your saved cover photos are stored on this device, so you get a lot more room and stop running into "bookshelf is full" errors.</p>
          <p>Your existing cover photos are being moved over <strong>automatically, in the background</strong> — this happens on its own, right now, and there's nothing you need to do.</p>
          <p>If you'd like a little extra peace of mind anyway, you can download a backup first before continuing (totally optional):</p>
        </section>
      </div>
      <div class="form-actions" style="flex-direction:column; align-items:stretch;">
        <button type="button" class="text-btn secondary" id="migration-notice-backup-btn">Download a backup</button>
        <p class="import-message hidden" id="migration-notice-backup-status"></p>
        <button type="button" class="text-btn primary" id="migration-notice-continue-btn">Got it, continue</button>
      </div>
    </div>
  </template>

  <template id="tpl-instructions">
    <div class="sheet instructions-sheet">
      <header class="sheet-header">
        <h2>Instructions</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>
      <div class="instructions-body">
        <section>
          <h3>Installing on your phone</h3>
          <p>This is a web app, not an app-store app — but you can add it to your Home Screen so it opens full-screen, just like a regular app.</p>
          <p><strong>iOS (Safari):</strong> tap the Share icon, then "Add to Home Screen".</p>
          <p><strong>Android (Chrome):</strong> tap the ⋮ menu, then "Add to Home screen" (or "Install app").</p>
        </section>
        <section>
          <h3>Adding a book</h3>
          <p>Tap the <strong>+</strong> button. Paste a link to a book page (Goodreads, Amazon, a bookshop…) and tap "Fetch details" to pull in the cover image, title and author automatically — not every site exposes all three, so double-check and fill in anything missing yourself.</p>
        </section>
        <section>
          <h3>Shelves</h3>
          <p>A book moves itself between shelves as you log dates — no manual filing needed:</p>
          <p><strong>To Read</strong> → log a start date and it moves to <strong>Reading</strong>. <strong>Reading</strong> → log a finish date and it moves to <strong>Home</strong>, your finished-books feed.</p>
          <p>Log dates from a book's detail view with the "Start reading today" / "Finish reading today" buttons, or backdate them from Edit.</p>
        </section>
        <section>
          <h3>Rating, genre &amp; format</h3>
          <p>Rate any book 1–5 stars at any time. Tag it with a genre and mark it as a physical book or an audiobook — use the filter icon on any shelf to narrow down by star rating, genre or format, or to sort by date or rating.</p>
        </section>
        <section>
          <h3>Search</h3>
          <p>Tap the search icon on any shelf to search titles, authors, genres and notes across your whole bookshelf at once, regardless of status.</p>
        </section>
        <section>
          <h3>Backup &amp; sharing</h3>
          <p>Export a single book to share with someone, or back up everything at once from Settings. Importing always merges into what you already have — it never replaces or deletes anything.</p>
        </section>
        <section>
          <h3>Your data</h3>
          <p>Everything you save is stored only on this device — there's no account, no server-side database, and nothing is collected. The only network request the app makes is a stateless link "unfurl" when you paste a URL, and it doesn't store anything either.</p>
          <p><strong>Removing the app from your Home Screen deletes its saved data too</strong> — it's not just an icon, so deleting it works the same as uninstalling an app.</p>
          <p>Use <strong>Export all data</strong> in Settings every so often to keep a backup.</p>
        </section>
        <section>
          <h3>Themes</h3>
          <p>Pick Playful, Light, or Dark from Settings → Customize. Playful lets you choose your own accent color too.</p>
        </section>
      </div>
    </div>
  </template>

  <template id="tpl-how-it-works">
    <div class="sheet">
      <header class="sheet-header">
        <h2>How this app works</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>
      <div class="instructions-body">
        <section>
          <h3>It's a PWA</h3>
          <p>This is a "Progressive Web App" — a website that behaves like an installed app. Add it to your Home Screen from the browser's share/menu button and it opens full-screen and works offline, no app store involved.</p>
        </section>
        <section>
          <h3>Your data, your device</h3>
          <p>There's no central database. Everything you enter lives only in this browser, on this device — nothing is sent to a server, because there isn't one.</p>
        </section>
        <section>
          <h3>Backups are on you</h3>
          <p>That also means backing up is your responsibility. There's no account recovery and no "we've got your data" safety net — export a backup every so often, especially before switching devices or clearing your browser's data.</p>
        </section>
        <section>
          <h3>The app itself can still update</h3>
          <p>The look, features, and bug fixes can improve over time — that's just code changing. Updates never touch your data; it stays exactly where it is.</p>
        </section>
      </div>
      <div class="form-actions">
        <button type="button" class="text-btn primary" id="how-it-works-got-it-btn">Got it</button>
      </div>
    </div>
  </template>

  <template id="tpl-cloud-sync">
    <div class="sheet">
      <header class="sheet-header">
        <h2>Cloud sync</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>
      </header>
      <p class="cloud-sync-intro">Optional and off by default. My Bookshelf never hosts your data — connect your own free Supabase project instead, to enable a full cloud backup, without giving up the local-first design. Already syncing another Make It Local app? You can connect this one to that same project instead of starting from scratch — no new account or project needed.</p>
      <p class="import-message hidden" id="cloud-sync-message"></p>
      <div class="hidden" id="cloud-sync-disconnected">
        <div id="cloud-wizard-step-1">
          <p class="card-detail-section-label">Step 1 of 3</p>
          <h3>Create a free Supabase account</h3>
          <p class="cloud-sync-intro">Supabase hosts your own private database — free, no credit card needed. My Bookshelf never sees or stores this data itself; it only ever talks to the one project you create and connect below. Already have an account from another Make It Local app? It's the same account — no need to make another.</p>
          <div class="form-actions">
            <a class="text-btn secondary" href="https://supabase.com/dashboard/sign-up" target="_blank" rel="noopener">Open supabase.com</a>
          </div>
          <div class="form-actions">
            <button type="button" class="text-btn primary" id="cloud-wizard-step1-continue-btn">Continue</button>
          </div>
          <p class="cloud-sync-intro"><button type="button" class="text-btn-inline" id="cloud-wizard-skip-to-connect-btn">Already have a Supabase account and project? Skip to Connect</button></p>
        </div>
        <div class="hidden" id="cloud-wizard-step-2">
          <p class="card-detail-section-label">Step 2 of 3</p>
          <h3>Create a new project</h3>
          <p class="cloud-sync-intro">In your Supabase dashboard, click <strong>New project</strong>. Name it anything (e.g. "my-bookshelf"), pick any region, and set a database password — the free tier is more than enough for this. Already have a project set up for another Make It Local app? Reuse that one instead — just connect below and pick it.</p>
          <div class="form-actions">
            <button type="button" class="text-btn primary" id="cloud-wizard-step2-continue-btn">Continue</button>
          </div>
          <p class="cloud-sync-intro"><button type="button" class="text-btn-inline" id="cloud-wizard-step2-back-btn">Back</button></p>
        </div>
        <div class="hidden" id="cloud-wizard-step-3">
          <p class="card-detail-section-label">Step 3 of 3</p>
          <h3>Connect your project</h3>
          <p class="cloud-sync-intro">Supabase will ask you to approve access, then you'll pick which specific project is My Bookshelf's on the next screen — the approval covers your whole account, not just one project. Picking a project that already has Cloud Backup from another Make It Local app? You'll be asked for its passphrase next, instead of setting anything up from scratch.</p>
          <div class="form-actions">
            <button type="button" class="text-btn primary" id="cloud-sync-connect-btn">Connect Supabase</button>
          </div>
          <p class="cloud-sync-intro"><button type="button" class="text-btn-inline" id="cloud-wizard-step3-back-btn">Back</button></p>
        </div>
        <div class="cloud-sync-restore-section">
          <p class="card-detail-section-label">Already set up elsewhere?</p>
          <p class="cloud-sync-intro">Don't want to (or can't) sign in to Supabase on this device at all? Paste a pairing code from a device that's already syncing instead — this skips the Supabase login entirely. If you do have Supabase access on this device, Connect above instead — it'll offer to add this app straight to your existing project.</p>
          <div class="form-actions">
            <button type="button" class="text-btn secondary" id="cloud-sync-restore-btn">Restore from Cloud</button>
          </div>
        </div>
      </div>
      <div class="hidden" id="cloud-sync-connected">
        <p class="cloud-sync-status hidden" id="cloud-sync-loading"><span class="btn-spinner" aria-hidden="true"></span>Loading your Supabase projects…</p>
        <p class="cloud-sync-status" id="cloud-sync-status-line"></p>
        <div class="cloud-sync-feature-summary hidden" id="cloud-sync-feature-summary"></div>

        <div class="hidden" id="cloud-sync-backup-section">
          <p class="card-detail-section-label" style="margin-top:8px;">Cloud Backup</p>
          <p class="cloud-sync-intro" id="cloud-sync-last-synced"></p>
          <p class="import-message hidden" id="cloud-sync-backup-message"></p>
          <div class="form-actions">
            <button type="button" class="text-btn secondary" id="cloud-sync-sync-now-btn">Sync now</button>
            <button type="button" class="text-btn secondary" id="cloud-sync-show-pairing-btn">Show pairing code</button>
          </div>
          <textarea class="pairing-code-box hidden" id="cloud-sync-pairing-code" rows="3" readonly></textarea>
          <div class="form-actions hidden" id="cloud-sync-copy-pairing-actions">
            <button type="button" class="text-btn secondary" id="cloud-sync-copy-pairing-btn">Copy pairing code</button>
          </div>
          <p class="card-detail-section-label" style="margin-top:18px;">Adding another Make It Local app?</p>
          <p class="cloud-sync-intro">If another app detects this project already has Cloud Backup set up, it'll ask for this passphrase to join it — not the pairing code above, just this.</p>
          <textarea class="pairing-code-box hidden" id="cloud-sync-passphrase-box" rows="1" readonly></textarea>
          <div class="form-actions">
            <button type="button" class="text-btn secondary" id="cloud-sync-copy-passphrase-btn">Copy passphrase</button>
          </div>
        </div>

        <div class="hidden form-actions" id="cloud-sync-manage-toggle-row">
          <button type="button" class="text-btn secondary" id="cloud-sync-manage-btn">Manage connection</button>
        </div>
        <div id="cloud-sync-manage-section">
          <div class="project-picker-list" id="cloud-sync-project-picker"></div>
          <div class="hidden" id="cloud-sync-join-section">
            <p class="card-detail-section-label" style="margin-top:8px;">Cloud Backup</p>
            <p class="cloud-sync-intro">This project already has Cloud Backup set up — probably from another Make It Local app, or this same app on another device. Enter its passphrase to add this app to it, no new setup needed.</p>
            <label class="field">
              <span>Backup passphrase</span>
              <input type="text" id="cloud-sync-join-passphrase" autocomplete="off" autocapitalize="off" spellcheck="false" />
            </label>
            <p class="import-message hidden" id="cloud-sync-join-message"></p>
            <div class="form-actions">
              <button type="button" class="text-btn primary" id="cloud-sync-join-btn">Add this app</button>
            </div>
          </div>
          <div class="hidden" id="cloud-sync-install-section">
            <p class="card-detail-section-label" style="margin-top:8px;">Cloud Backup</p>
            <p class="cloud-sync-intro">Backs up and syncs all your books, including cover photos, to your own Supabase project.</p>
            <div class="cloud-sync-steps" id="cloud-sync-install-steps"></div>
            <div class="form-actions">
              <button type="button" class="text-btn primary" id="cloud-sync-install-btn">Install Cloud Backup</button>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="text-btn secondary" id="cloud-sync-disconnect-btn">Disconnect</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-cloud-restore">
    <div class="sheet">
      <header class="sheet-header">
        <h2>Restore from Cloud</h2>
        <button class="icon-btn close-btn" aria-label="Close"><svg class="icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg></button>

        <textarea id="cloud-restore-code" rows="4" placeholder="Paste the code here…"></textarea>
      </label>
      <p class="import-message hidden" id="cloud-restore-message"></p>
      <div class="form-actions">
        <button type="button" class="text-btn primary" id="cloud-restore-apply-btn">Restore</button>
      </div>
    </div>
  </template>
